<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E3BE6">
<title>EasyFood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#101437;--muted:#6C7199;--bg:#F2F4FB;--card:#fff;--brand:#2E3BE6;--heart:#FFC533;--line:#DFE3F3;--ok:#1E8F5E;--err:#C4321F}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Bricolage Grotesque',-apple-system,'Segoe UI',Roboto,sans-serif;background:#D9DDF2;color:var(--ink);display:flex;justify-content:center;align-items:center}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.phone{width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(min-width:520px){
  .phone{width:390px;height:844px;max-height:calc(100vh - 24px);border-radius:44px;border:8px solid var(--ink);box-shadow:0 30px 70px rgba(30,20,51,.25)}
}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}

/* Hero */
.hero{background:var(--brand);color:#fff;padding:max(16px,env(safe-area-inset-top)) 20px 32px;border-radius:0 0 56px 0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.where{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.where small{display:block;font-size:11px;font-weight:400;opacity:.7}
.cart{position:relative;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:#fff;color:var(--brand);font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--brand)}
.hero h1{font-size:44px;line-height:.98;font-weight:800;letter-spacing:-.04em;margin-bottom:20px}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:0 16px;height:52px;color:var(--ink);box-shadow:0 10px 24px rgba(8,12,70,.28)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:15px;min-width:0}
.search input::placeholder{color:var(--muted)}
.search:focus-within{box-shadow:0 0 0 3px var(--ink)}

/* Sheet */
.sheet{position:relative}
.cats{display:flex;gap:22px;padding:18px 20px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.cats::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;padding:6px 0 12px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.chip span{font-size:16px;line-height:1}
.chip.active{color:var(--ink);border-bottom-color:var(--brand)}
.head{display:flex;justify-content:space-between;align-items:baseline;padding:22px 20px 12px}
.head h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sort{font-size:13px;font-weight:600;color:var(--brand);padding:6px 0}
.list{padding:0 20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.list>.state,.list>.more,.list>.skel.wide{grid-column:1/-1}
.card{background:var(--card);border-radius:26px 26px 26px 6px;overflow:hidden;position:relative;display:flex;flex-direction:column;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.thumb{position:relative;height:118px;display:grid;place-items:center;font-size:54px}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}
.info h3{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.tag{font-size:13px;color:var(--muted)}
.facts{display:flex;flex-direction:column;gap:2px;margin-top:8px;font-size:12px;font-weight:600}
.rate{position:absolute;left:10px;bottom:10px;background:var(--brand);color:#fff;border-radius:10px;padding:3px 9px;font-size:12px;font-weight:800}
.fee{color:var(--brand)}
.fav{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#B3B8D6}
.fav svg{width:18px;height:18px}
.fav[aria-pressed=true]{color:var(--heart)}
.fav[aria-pressed=true] svg{stroke:#E0A400}
.fav[aria-pressed=true] svg{fill:currentColor}
.more{height:52px;border-radius:16px;background:var(--brand);color:#fff;font-weight:700;font-size:15px}
.more:disabled{opacity:.6}

.skel{height:210px;border-radius:26px 26px 26px 6px;background:linear-gradient(90deg,#ECE8F4 25%,#F7F5FB 50%,#ECE8F4 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.state{text-align:center;padding:44px 24px;color:var(--muted);font-size:14px;line-height:1.5}
.state b{display:block;color:var(--ink);font-size:17px;margin:6px 0 4px}
.state .big{font-size:42px}
.state code{background:#fff;padding:2px 8px;border-radius:8px;color:var(--ink)}

/* Other views */
.view{display:none;padding:max(20px,env(safe-area-inset-top)) 20px 24px}
.view.active{display:block}
.view>h2{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-bottom:6px}
.view>p{color:var(--muted);font-size:14px;margin-bottom:20px}
.panel{background:var(--card);border-radius:22px;padding:18px;margin-bottom:16px}
.panel h3{font-size:16px;font-weight:800;margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input,.field select{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:14px;font-size:15px;background:var(--bg);outline:0}
.field input:focus,.field select:focus{border-color:var(--ink);background:#fff}
.field input[type=file]{padding:10px;font-size:13px}
.btn{width:100%;height:52px;border-radius:16px;background:var(--brand);color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.6}
.msg{display:none;margin-top:12px;padding:12px;border-radius:12px;font-size:13px;font-weight:600;text-align:center}
.msg.success{display:block;background:#DDF3E8;color:var(--ok)}
.msg.error{display:block;background:#FBE4DF;color:var(--err)}
.who{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--brand);display:grid;place-items:center;font-size:30px;overflow:hidden;flex-shrink:0}
.avatar img,.dishimg img{width:100%;height:100%;object-fit:cover}
.who b{font-size:17px;display:block}
.who small{color:var(--muted);font-size:13px}
.dishimg{width:100%;height:140px;border-radius:16px;background:var(--bg);display:grid;place-items:center;font-size:40px;overflow:hidden;margin-bottom:14px}

/* Bottom nav */
.nav{display:flex;justify-content:space-around;margin:0 16px max(12px,env(safe-area-inset-bottom));padding:8px;background:var(--ink);border-radius:30px;box-shadow:0 12px 28px rgba(16,20,55,.35)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:600;color:#9EA4D6;padding:2px 6px;min-width:56px}
.nav i{width:44px;height:30px;border-radius:15px;display:grid;place-items:center}
.nav button[aria-current=page]{color:#fff}
.nav button[aria-current=page] i{background:var(--brand)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="phone">
  <main class="screen" id="screen">

    <!-- Início / Buscar / Favoritos -->
    <section id="home-view">
      <header class="hero">
        <div class="top">
          <div class="where">
            <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
            <div><small>Entregar em</small>Minha casa</div>
          </div>
          <button class="cart" aria-label="Carrinho, 2 itens">
            <svg viewBox="0 0 24 24"><path d="M5 7h14l-1.2 11a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 7zM9 7a3 3 0 0 1 6 0"/></svg>
            <span class="badge">2</span>
          </button>
        </div>
        <h1>Fome de quê?</h1>
        <label class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="search-input" placeholder="Buscar restaurantes" autocomplete="off">
        </label>
      </header>

      <div class="sheet">
        <div class="cats" id="categories"></div>
        <div class="head">
          <h2 id="list-title">Restaurantes</h2>
          <button class="sort" id="sort-btn">Ordenar: relevância</button>
        </div>
        <div class="list" id="restaurant-list"></div>
      </div>
    </section>

    <!-- Cadastrar -->
    <section class="view" id="add-restaurant-section">
      <h2>Novo restaurante</h2>
      <p>Preencha os dados para aparecer na lista.</p>
      <form class="panel" id="add-restaurant-form">
        <div class="field">
          <label for="restaurant-name">Nome do restaurante</label>
          <input type="text" id="restaurant-name" placeholder="Ex: Taco Loco" required>
        </div>
        <div class="field">
          <label for="restaurant-category">Categoria</label>
          <select id="restaurant-category" required>
            <option value="">Selecione uma categoria</option>
            <option value="Burger">🍔 Burger</option>
            <option value="Pizza">🍕 Pizza</option>
            <option value="Sushi">🍣 Sushi</option>
            <option value="Saudável">🥗 Saudável</option>
            <option value="Mexicana">🌮 Mexicana</option>
            <option value="Brasileira">🍛 Brasileira</option>
            <option value="Japonesa">🍱 Japonesa</option>
            <option value="Italiana">🍝 Italiana</option>
          </select>
        </div>
        <div class="field">
          <label for="restaurant-rating">Avaliação (0 a 5)</label>
          <input type="number" id="restaurant-rating" placeholder="Ex: 4.3" min="0" max="5" step="0.1" required>
        </div>
        <button type="submit" class="btn" id="submit-btn">Cadastrar restaurante</button>
        <div class="msg" id="form-message" role="status"></div>
      </form>
    </section>

    <!-- Perfil -->
    <section class="view" id="profile-section">
      <h2>Perfil</h2>
      <p>Atualize sua foto e as imagens dos pratos.</p>

      <div class="panel">
        <div class="who">
          <div class="avatar" id="avatar-preview-container">
            <span id="avatar-placeholder">👤</span>
            <img id="avatar-img" src="" alt="Foto de perfil" style="display:none">
          </div>
          <div>
            <b id="profile-user-name">Admin EasyFood</b>
            <small id="profile-user-email">admin@easyfood.com</small>
          </div>
        </div>
        <form id="avatar-upload-form">
          <div class="field">
            <label for="avatar-input">Foto de perfil (PNG, JPEG ou WebP)</label>
            <input type="file" id="avatar-input" accept="image/png, image/jpeg, image/webp" required>
          </div>
          <button type="submit" class="btn" id="upload-avatar-btn">Enviar foto de perfil</button>
        </form>
        <div class="msg" id="avatar-form-message" role="status"></div>
      </div>

      <div class="panel">
        <h3>Imagem do prato</h3>
        <div class="field">
          <label for="dish-select">Prato</label>
          <select id="dish-select" onchange="onDishSelectChange()">
            <option value="1">Prato #1 - Smash Bacon Duplo</option>
            <option value="2">Prato #2 - Pizza Margherita Especial</option>
            <option value="3">Prato #3 - Combo Sushi Salmão</option>
            <option value="4">Prato #4 - Bowl Mediterrâneo</option>
          </select>
        </div>
        <div class="dishimg" id="dish-preview-container">
          <span id="dish-placeholder">🍔</span>
          <img id="dish-img" src="" alt="Imagem do prato" style="display:none">
        </div>
        <form id="dish-upload-form">
          <div class="field">
            <label for="dish-input">Imagem do prato</label>
            <input type="file" id="dish-input" accept="image/png, image/jpeg, image/webp" required>
          </div>
          <button type="submit" class="btn" id="upload-dish-btn">Enviar imagem do prato</button>
        </form>
        <div class="msg" id="dish-form-message" role="status"></div>
      </div>
    </section>
  </main>

  <nav class="nav" aria-label="Navegação principal">
    <button data-view="home" aria-current="page"><i><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9H4z"/></svg></i>Início</button>
    <button data-view="search"><i><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></i>Buscar</button>
    <button data-view="add"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></i>Cadastrar</button>
    <button data-view="favorites"><i><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg></i>Favoritos</button>
    <button data-view="profile"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg></i>Perfil</button>
  </nav>
</div>

<script>
// EasyFood - Front-end (mesma API: /restaurants, /auth, /dishes)
const API_URL = "/restaurants";
const PAGE_SIZE = 4;

const CATS = {
  "Burger":["🍔","#FFE1B5"], "Pizza":["🍕","#FFD3CB"], "Sushi":["🍣","#FFD9E6"],
  "Saudável":["🥗","#D3F0DC"], "Mexicana":["🌮","#FFF0A6"], "Brasileira":["🍛","#E2D9FF"],
  "Japonesa":["🍱","#D3E8FF"], "Italiana":["🍝","#FFD8C0"]
};
const SORTS = [["relevância", null], ["avaliação", (a,b)=>b.rating-a.rating], ["nome", (a,b)=>a.name.localeCompare(b.name)]];

let all = [], shown = [], category = "Todos", query = "", page = 0, sortIdx = 0, onlyFav = false;
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem("ef-favs") || "[]")); } catch (e) {}

const $ = id => document.getElementById(id);
const list = $("restaurant-list");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Preço e tempo estáveis por restaurante
const fees = {};
const fee = id => fees[id] ??= (Math.random() * 5 + 3).toFixed(2).replace(".", ",");
const time = id => { const t = 15 + (id * 7) % 20; return `${t}–${t + 10} min`; };

// ----- Categorias -----
$("categories").innerHTML = [["Todos", ["🍽️"]], ...Object.entries(CATS)].map(([n, v], i) =>
  `<button class="chip${i ? "" : " active"}" data-category="${n}"><span>${v[0]}</span>${n}</button>`).join("");
$("categories").addEventListener("click", e => {
  const chip = e.target.closest(".chip"); if (!chip) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === chip));
  category = chip.dataset.category; render(true);
});
$("search-input").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(true); });
$("sort-btn").addEventListener("click", () => {
  sortIdx = (sortIdx + 1) % SORTS.length;
  $("sort-btn").textContent = "Ordenar: " + SORTS[sortIdx][0]; render(true);
});

// ----- Dados -----
async function fetchRestaurants() {
  list.innerHTML = '<div class="skel"></div>'.repeat(4);
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error();
    all = await res.json();
    render(true);
  } catch (e) {
    list.innerHTML = `<div class="state"><div class="big">⚠️</div><b>Servidor offline</b>Rode no terminal:<br><code>node server.js</code></div>`;
  }
}

// ----- Render -----
function render(reset) {
  if (reset) page = 0;
  shown = all.filter(r =>
    (category === "Todos" || r.category === category) &&
    (!onlyFav || favs.has(r.id)) &&
    r.name.toLowerCase().includes(query));
  const sorter = SORTS[sortIdx][1]; if (sorter) shown.sort(sorter);

  const end = (page + 1) * PAGE_SIZE;
  if (!shown.length) {
    list.innerHTML = `<div class="state"><div class="big">${onlyFav ? "💛" : "🔍"}</div><b>${onlyFav ? "Nenhum favorito ainda" : "Nada por aqui"}</b>${onlyFav ? "Toque no coração de um restaurante para salvá-lo." : "Tente outra categoria ou outro nome."}</div>`;
    return;
  }
  let html = shown.slice(0, end).map((r, i) => {
    const [emoji, tint] = CATS[r.category] || ["🏪", "#ECE8F4"];
    const on = favs.has(r.id);
    return `<article class="card" style="animation-delay:${(i % PAGE_SIZE) * 50}ms">
      <div class="thumb" style="background:${tint}">${emoji}
        <span class="rate">★ ${Number(r.rating || 0).toFixed(1)}</span>
        <button class="fav" data-id="${r.id}" aria-pressed="${on}" aria-label="${on ? "Remover dos" : "Adicionar aos"} favoritos">
          <svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></svg>
        </button>
      </div>
      <div class="info">
        <h3>${esc(r.name)}</h3>
        <span class="tag">${esc(r.category || "Restaurante")}</span>
        <div class="facts"><span>${time(r.id)}</span><span class="fee">Entrega R$ ${fee(r.id)}</span></div>
      </div></article>`;
  }).join("");
  if (end < shown.length) {
    const n = shown.length - end;
    html += `<button class="more" id="load-more-btn" onclick="loadMore()">Ver mais (${n} restante${n > 1 ? "s" : ""})</button>`;
  }
  list.innerHTML = html;
}

function loadMore() {
  const b = $("load-more-btn"); b.disabled = true; b.textContent = "Carregando...";
  setTimeout(() => { page++; render(); }, 250);
}

list.addEventListener("click", e => {
  const b = e.target.closest(".fav"); if (!b) return;
  const id = Number(b.dataset.id);
  favs.has(id) ? favs.delete(id) : favs.add(id);
  try { localStorage.setItem("ef-favs", JSON.stringify([...favs])); } catch (e) {}
  onlyFav ? render() : (b.setAttribute("aria-pressed", favs.has(id)));
});

// ----- Navegação -----
function switchView(view) {
  const home = ["home", "search", "favorites"].includes(view);
  $("home-view").style.display = home ? "" : "none";
  $("add-restaurant-section").classList.toggle("active", view === "add");
  $("profile-section").classList.toggle("active", view === "profile");
  document.querySelectorAll(".nav button").forEach(b =>
    b.dataset.view === view ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  $("screen").scrollTo({ top: 0 });

  if (home) {
    onlyFav = view === "favorites";
    $("list-title").textContent = onlyFav ? "Seus favoritos" : "Restaurantes";
    render(true);
    if (view === "search") $("search-input").focus();
  }
  if (view === "profile") { loadUserProfile(); onDishSelectChange(); }
}
document.querySelector(".nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if (b) switchView(b.dataset.view);
});

// ----- Cadastro de restaurante (POST /restaurants) -----
const addForm = $("add-restaurant-form");
addForm.addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("restaurant-name").value.trim();
  const category = $("restaurant-category").value;
  const rating = parseFloat($("restaurant-rating").value);
  if (!name || !category || isNaN(rating)) return showMsg("form-message", "Preencha todos os campos corretamente.", "error");

  const btn = $("submit-btn"); btn.disabled = true; btn.textContent = "Cadastrando...";
  try {
    const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, category, rating }) });
    if (!res.ok) throw new Error();
    const created = await res.json();
    showMsg("form-message", `“${created.name}” foi cadastrado.`, "success");
    addForm.reset(); all.push(created);
  } catch (err) {
    showMsg("form-message", "Não foi possível cadastrar. Verifique se o servidor está rodando.", "error");
  } finally { btn.disabled = false; btn.textContent = "Cadastrar restaurante"; }
});

function showMsg(id, text, type) {
  const el = $(id); el.textContent = text; el.className = "msg " + type;
  setTimeout(() => el.className = "msg", 4000);
}

// ----- Perfil e upload de imagens -----
let token = null;
async function ensureAuthToken() {
  if (token) return token;
  try {
    const res = await fetch("/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: "admin@easyfood.com", password: "admin123" }) });
    token = (await res.json()).token; return token;
  } catch (err) { console.error("Erro ao autenticar:", err); return null; }
}

function setImg(imgId, phId, url) {
  const img = $(imgId), ph = $(phId);
  if (url) { img.src = url + "?t=" + Date.now(); img.style.display = "block"; ph.style.display = "none"; }
  else { img.style.display = "none"; ph.style.display = ""; }
}

async function loadUserProfile() {
  const t = await ensureAuthToken(); if (!t) return;
  try {
    const { user } = await (await fetch("/auth/me", { headers: { Authorization: `Bearer ${t}` } })).json();
    if (!user) return;
    $("profile-user-name").textContent = user.name;
    $("profile-user-email").textContent = user.email;
    setImg("avatar-img", "avatar-placeholder", user.avatarUrl);
  } catch (err) { console.error("Erro ao carregar perfil:", err); }
}

async function onDishSelectChange() {
  try {
    const dish = await (await fetch(`/dishes/${$("dish-select").value}`)).json();
    setImg("dish-img", "dish-placeholder", dish && dish.imageUrl);
  } catch (err) { setImg("dish-img", "dish-placeholder", null); }
}

function bindUpload({ formId, inputId, btnId, msgId, url, idleText, okText, apply }) {
  const form = $(formId);
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const file = $(inputId).files[0]; if (!file) return;
    const t = await ensureAuthToken(), btn = $(btnId);
    btn.disabled = true; btn.textContent = "Enviando...";
    const body = new FormData(); body.append("image", file);
    try {
      const res = await fetch(url(), { method: "POST", headers: { Authorization: `Bearer ${t}` }, body });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Erro ao enviar imagem");
      showMsg(msgId, okText, "success"); apply(data); form.reset();
    } catch (err) { showMsg(msgId, err.message, "error"); }
    finally { btn.disabled = false; btn.textContent = idleText; }
  });
}
bindUpload({ formId: "avatar-upload-form", inputId: "avatar-input", btnId: "upload-avatar-btn", msgId: "avatar-form-message",
  url: () => "/auth/me/image", idleText: "Enviar foto de perfil", okText: "Foto de perfil atualizada.",
  apply: d => d.user && setImg("avatar-img", "avatar-placeholder", d.user.avatarUrl) });
bindUpload({ formId: "dish-upload-form", inputId: "dish-input", btnId: "upload-dish-btn", msgId: "dish-form-message",
  url: () => `/dishes/${$("dish-select").value}/image`, idleText: "Enviar imagem do prato", okText: "Imagem do prato salva.",
  apply: d => d.dish && setImg("dish-img", "dish-placeholder", d.dish.imageUrl) });

fetchRestaurants();
</script>
